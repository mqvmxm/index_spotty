<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotty Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="login-card">
    
    <h1>Iniciar sesión Spotty</h1>
    <p>Ingresa tus datos para iniciar sesión.</p>

    <form action="#" method="POST">
      
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email">
      </div>

      <div class="campo">
        <div class="encabezado-contrasena">
          <label for="password">Contraseña</label>
          <a href="#" class="enlace">¿Olvidaste tu contraseña?</a>
        </div>
        <input type="password" id="password" required minlength="8">
      </div>

      <button type="submit" class="btn-principal">Iniciar Sesión</button>

    </form>

    <p class="registro">
      ¿No tienes cuenta? <a href="#" class="enlace">Regístrate aquí</a>
    </p>

  </main>

</body>
</html>
